[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidyms"
version = "0.7.1"
description = "Tools for working with MS data in metabolomics"
authors = [{ name = "Gabriel Riquelme" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "beautifulsoup4>=4.11.2",
    "bokeh>=3.0",
    "Cerberus>=1.3",
    "dill>=0.3.6",
    "ipython>=8.2",
    "joblib>=1.4",
    "matplotlib>=3.9.1",
    "natsort>=8.2.0",
    "networkx>=3",
    "numpy>=2.0.0",
    "openpyxl>=3.0",
    "pandas>=2.2.2",
    "plotnine>=0.10.1",
    "requests>=2.32.3",
    "scikit-learn>=1.5.1",
    "scipy>=1.13",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.2",
    "tqdm>=4.66.4",
    "umap-learn>=0.5.3",
    "xlrd>=2.0.1",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/griquelme/tidyms"

[tool.mypy]
python_version = "3.9"
files = ["src/tidyms"]

[tool.pytest.ini_options]
pythonpath = [".", "./src"]
